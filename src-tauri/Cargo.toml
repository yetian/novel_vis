[package]
name = "chronospace-reader"
version = "0.1.25"
description = "ChronoSpace Reader (时空编年史) - spatiotemporal narrative extraction studio"
authors = ["ChronoSpace Team"]
edition = "2021"
rust-version = "1.77"
default-run = "chronospace-reader"

[lib]
name = "chronospace_reader_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-os = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

rusqlite = { version = "0.32", features = ["bundled", "chrono"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }

anyhow = "1"
thiserror = "1"
sha2 = "0.10"
regex = "1"
once_cell = "1"
parking_lot = "0.12"
base64 = "0.22"
encoding_rs = "0.8"

zip = { version = "2", default-features = false, features = ["deflate"] }
quick-xml = "0.36"

[features]
default = []
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
